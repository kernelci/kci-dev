name: Make Fedora Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git \
            glibc-langpack-en \
            pyproject-rpm-macros \
            python3-build \
            python3-devel \
            python3-installer \
            python3-pip \
            python3-poetry-core \
            rpm-build \
            rpmlint

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update RPM version from pyproject.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "${VERSION}"
          sed -i \
            -e "s/^Version:.*/Version:        ${VERSION}/" \
            -e 's/^Release:.*/Release:        1%{?dist}/' \
            -e "0,/ - 0-0$/s// - ${VERSION}-1/" \
            packaging/obs/kci-dev.spec
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "Building version: ${VERSION}"

      - name: Validate RPM spec
        run: |
          rpmspec --parse packaging/obs/kci-dev.spec >/dev/null
          rpmlint --ignore-unused-rpmlintrc packaging/obs/kci-dev.spec

      - name: Create source archive
        run: |
          mkdir -p "${HOME}/rpmbuild/SOURCES"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git archive --format=tar.gz \
            --output="${HOME}/rpmbuild/SOURCES/v${VERSION}.tar.gz" \
            --prefix="kci-dev-${VERSION}/" \
            HEAD

      - name: Build Fedora package
        run: rpmbuild -ba packaging/obs/kci-dev.spec

      - name: Verify built package digests
        run: rpm --checksig "${HOME}"/rpmbuild/RPMS/noarch/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm

      - name: Report rpmlint findings for built packages
        run: rpmlint -r packaging/obs/kci-dev.rpmlintrc "${HOME}"/rpmbuild/RPMS/noarch/*.rpm "${HOME}"/rpmbuild/SRPMS/*.rpm

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp "${HOME}"/rpmbuild/RPMS/noarch/*.rpm artifacts/
          cp "${HOME}"/rpmbuild/SRPMS/*.rpm artifacts/

      - name: Upload Fedora package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kci-dev-fedora-package
          path: artifacts/

      - name: Upload Fedora package to GitHub Release on new tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*.rpm
